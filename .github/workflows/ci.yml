name: Biddy checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: biddy, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: biddy}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U biddy" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest tests -q
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://biddy:ci-only-password@localhost:5432/biddy
      - run: python -m evals.run --persist
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://biddy:ci-only-password@localhost:5432/biddy
          LLM_PROVIDER: rules
      - run: python scripts/verify_local.py
        env:
          BIDDY_VERIFY_DATABASE_URL: postgresql+psycopg://biddy:ci-only-password@localhost:5432/biddy
